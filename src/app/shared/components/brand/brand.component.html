<a
  routerLink="/"
  class="inline-flex shrink-0 items-center gap-[11px] leading-[1.25] in-[.site-footer]:text-white"
  [attr.aria-label]="school().name + ' home'"
>
  <img
    class="block shrink-0 w-[104px] h-[50px] object-cover object-center in-[.site-footer]:w-[94px] in-[.site-footer]:h-auto in-[.site-footer]:object-contain in-[.site-footer]:p-[7px] in-[.site-footer]:rounded-[7px] in-[.site-footer]:bg-white"
    src="/assets/images/logo-pragaya.png"
    width="384"
    height="166"
    alt=""
  />
  <span class="flex flex-col justify-center gap-1">
    <strong class="block font-[var(--heading)] font-bold text-base leading-none tracking-[-0.04em]">
      {{ school().name }}
    </strong>
    <small
      class="block text-[var(--blue-deep)] in-[.site-footer]:text-[#ccd9ef] text-[8.5px] leading-none font-bold tracking-[0.045em] uppercase"
    >
      International School Award 2020-23
    </small>
  </span>
</a>
