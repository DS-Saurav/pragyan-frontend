<app-page-intro
  label="Facilities"
  title="A child-friendly learning environment"
  description="The school’s educational approach emphasizes spaces and materials that help children take part comfortably and learn independently."
/>

<section
  class="mx-auto w-[min(100%-32px,1440px)] min-[461px]:w-[min(100%-40px,1440px)] min-[711px]:w-[min(100%-64px,1440px)] py-[clamp(40px,4.5vw,68px)] grid grid-cols-1 min-[711px]:grid-cols-[0.78fr_1.2fr] gap-[clamp(28px,6vw,88px)]"
>
  <div>
    <app-eyebrow>Learning environment</app-eyebrow>
    <h2 class="mt-3">Features to confirm</h2>
    <p class="mt-3.5 text-[var(--muted-ink)]">
      This list is not a confirmed inventory. Please ask the school about current facilities and
      arrangements.
    </p>
  </div>
  <ul class="grid grid-cols-1 min-[461px]:grid-cols-2 gap-3">
    @for (item of facilities(); track item.title) {
      <li
        class="flex items-center gap-[11px] p-[11px] border border-[var(--line)] rounded-[13px] font-semibold text-sm bg-white"
      >
        <span
          class="grid place-items-center flex-none w-10 h-10 rounded-[9px] bg-[var(--blue-light)] text-[var(--blue-deep)]"
        >
          <ng-container *ngComponentOutlet="item.icon; inputs: { size: 21 }" />
        </span>
        {{ item.title }}
      </li>
    }
  </ul>
</section>

<app-admission-band />
