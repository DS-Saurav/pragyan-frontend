<div class="ui-stat transition-shadow hover:border-slate-300 hover:shadow-md">
  <div class="min-w-0">
    <p class="ui-stat-label">{{ label() }}</p>
    <p class="ui-stat-value">{{ value() }}</p>
  </div>
  <span [class]="'ui-stat-icon ' + toneClass()">
    <ng-container *ngComponentOutlet="icon(); inputs: { size: 20 }" />
  </span>
</div>
