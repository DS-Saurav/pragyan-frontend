<app-page-intro
  label="Gallery"
  title="Learning in pictures"
  description="These illustrative images show what learning through play, creativity and collaboration can look like. They do not depict Pragyan Paathshala or its students."
/>

<section
  class="mx-auto w-[min(100%-32px,1440px)] min-[461px]:w-[min(100%-40px,1440px)] min-[711px]:w-[min(100%-64px,1440px)] pt-10 pb-16"
  aria-label="Browse photo gallery"
>
  <app-filters
    [categories]="categories()"
    label="Filter photos by category"
    [active]="category()"
    (categoryChange)="onCategoryChange($event)"
  />

  <div class="grid grid-cols-2 gap-2 sm:gap-4 md:grid-cols-3 lg:grid-cols-4">
    @for (item of items(); track item.src; let idx = $index) {
      <article
        class="group relative overflow-hidden rounded-2xl bg-slate-200 text-left transition-all duration-200 hover:-translate-y-0.5 hover:shadow-xl focus-within:-translate-y-0.5 focus-within:shadow-xl"
      >
        <img
          [src]="item.src"
          [alt]="item.alt"
          loading="lazy"
          class="aspect-[3/2] h-full w-full object-cover transition-transform duration-300 group-hover:scale-105"
        />
        <span
          class="pointer-events-none absolute inset-x-0 bottom-0 z-10 flex items-end justify-between gap-1.5 bg-gradient-to-t from-slate-950/85 via-slate-950/40 to-transparent px-2.5 pt-6 pb-2.5 text-white opacity-100 transition-all duration-200 sm:gap-3 sm:px-4 sm:pt-9 sm:pb-3.5 sm:translate-y-1 sm:opacity-0 sm:group-hover:translate-y-0 sm:group-hover:opacity-100 sm:group-focus-within:translate-y-0 sm:group-focus-within:opacity-100"
        >
          <span>
            <small class="block text-[10px] font-semibold uppercase tracking-wider text-white/80 sm:text-[11px]">
              {{ item.category }}
            </small>
            <strong class="block text-xs font-semibold leading-snug sm:text-[15px]">
              {{ item.title }}
            </strong>
          </span>
          <svg lucideArrowUpRight [size]="18" class="shrink-0 text-white sm:h-5 sm:w-5"></svg>
        </span>
        <button
          class="absolute inset-0 z-20 w-full rounded-2xl focus-visible:outline-offset-[-4px]"
          type="button"
          (click)="openLightbox(idx, $event)"
          [attr.aria-label]="'View image: ' + item.title"
        ></button>
      </article>
    }
  </div>
</section>

<dialog
  #lightboxDialog
  class="fixed inset-0 m-auto w-fit max-w-[80vw] max-h-[80dvh] overflow-hidden rounded-2xl border-0 bg-transparent p-0 text-white shadow-2xl backdrop:bg-slate-950/85 backdrop:backdrop-blur-sm"
  aria-label="Photo viewer"
  (close)="onDialogClose()"
  (click)="onDialogBackdropClick($event)"
  (keydown)="onDialogKeydown($event)"
>
  @if (activePhoto(); as photo) {
    <div class="flex">
      <div class="relative leading-none">
        <img
          [src]="photo.src"
          [alt]="photo.alt"
          class="block h-auto w-[80vw] max-h-[80dvh] max-w-[80vw] object-contain sm:h-[80dvh] sm:w-auto"
        />
        <button
          type="button"
          class="absolute top-3 right-3 flex h-9 w-9 items-center justify-center rounded-full border border-white/25 bg-slate-900/60 text-white backdrop-blur-md transition hover:border-white/40 hover:bg-slate-900/85 active:scale-95"
          aria-label="Close image viewer"
          (click)="closeLightbox()"
        >
          <svg lucideX [size]="20"></svg>
        </button>
        @if (items().length > 1) {
          <button
            type="button"
            class="absolute top-1/2 left-3 flex h-10 w-10 -translate-y-1/2 items-center justify-center rounded-full border border-white/25 bg-slate-900/60 text-white backdrop-blur-md transition hover:border-white/40 hover:bg-slate-900/85 active:scale-95"
            (click)="step(-1)"
            aria-label="Previous image"
          >
            <svg lucideChevronLeft [size]="22"></svg>
          </button>
          <button
            type="button"
            class="absolute top-1/2 right-3 flex h-10 w-10 -translate-y-1/2 items-center justify-center rounded-full border border-white/25 bg-slate-900/60 text-white backdrop-blur-md transition hover:border-white/40 hover:bg-slate-900/85 active:scale-95"
            (click)="step(1)"
            aria-label="Next image"
          >
            <svg lucideChevronRight [size]="22"></svg>
          </button>
        }
      </div>
    </div>
  }
</dialog>
